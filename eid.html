<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid-Adha Mubarak</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    overflow-y:auto;

    background:
    radial-gradient(circle at top,#1c1235 0%,#070214 45%,#000 100%);

    font-family:'Segoe UI',Arial,sans-serif;
    color:white;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
}

.page{
    position:relative;
    z-index:2;

    min-height:100vh;

    padding:70px 20px 60px;

    display:flex;
    flex-direction:column;
    align-items:center;
}

.content{
    width:100%;
    max-width:1000px;
    text-align:center;
}

/* ===== TITLES ===== */

.title{
    font-size:72px;
    font-weight:900;

    color:#fff8dc;

    text-shadow:
    0 0 8px rgba(255,255,255,.9),
    0 0 18px rgba(255,230,150,.8),
    0 0 35px rgba(255,200,80,.7);

    min-height:85px;
}

.subtitle{
    font-size:90px;
    font-weight:900;

    color:#ffe082;

    text-shadow:
    0 0 10px rgba(255,240,180,.9),
    0 0 25px rgba(255,210,90,.9),
    0 0 45px rgba(255,170,40,.8);

    min-height:105px;
}

/* ===== ARABIC ===== */

.arabic{
    margin-top:30px;

    font-size:34px;
    line-height:1.9;
    font-weight:700;

    color:#fff5ff;

    text-shadow:
    0 0 8px rgba(255,255,255,.8),
    0 0 18px rgba(255,190,220,.8),
    0 0 30px rgba(255,140,200,.7);
}

/* ===== WORD EFFECT ===== */

.word{
    display:inline-block;

    opacity:0;

    transform:translateY(25px) scale(.9);

    animation:wordShow .6s ease forwards;

    margin:0 8px;
}

/* ===== IMAGE ===== */

.image-box{
    margin-top:45px;

    display:flex;
    flex-direction:column;
    align-items:center;

    animation:floatImg 4s ease-in-out infinite;
}

.image-box img{
    width:min(500px,90vw);

    display:block;

    filter:
    drop-shadow(0 0 20px rgba(255,189,69,.35))
    drop-shadow(0 0 50px rgba(255,189,69,.15));
}

/* ===== NAME ===== */

.credit{
    margin-top:25px;

    text-align:center;
}

.credit h2{
    font-size:34px;
    font-weight:900;

    color:#fff1b3;

    text-shadow:
    0 0 10px rgba(255,240,180,.8),
    0 0 25px rgba(255,200,80,.7);
}

.credit a{
    display:inline-block;

    margin-top:12px;

    text-decoration:none;

    font-size:22px;
    font-weight:700;

    color:#ffd6f6;

    text-shadow:
    0 0 8px rgba(255,183,213,.8),
    0 0 20px rgba(255,140,200,.6);

    transition:.3s;
}

.credit a:hover{
    transform:scale(1.08);

    color:#ffffff;
}

/* ===== ANIMATIONS ===== */

@keyframes wordShow{

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes floatImg{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-15px);
    }
}

/* ===== MOBILE ===== */

@media(max-width:768px){

    .page{
        padding-top:50px;
    }

    .title{
        font-size:46px;
        min-height:60px;
    }

    .subtitle{
        font-size:60px;
        min-height:75px;
    }

    .arabic{
        font-size:22px;
        line-height:2;
        margin-top:20px;
    }

    .image-box{
        margin-top:35px;
    }

    .image-box img{
        width:95vw;
    }

    .credit h2{
        font-size:26px;
    }

    .credit a{
        font-size:18px;
    }
}

</style>
</head>

<body>

<!-- ===== MUSIC ===== -->

<audio id="bgMusic" autoplay loop muted>
    <source src="eid.mp3" type="audio/mpeg">
</audio>

<canvas id="canvas"></canvas>

<div class="page">

    <div class="content">

        <div class="title" id="title1"></div>

        <div class="subtitle" id="title2"></div>

        <div class="arabic" id="arabicText"></div>

    </div>

    <div class="image-box">

        <img src="eid.png" alt="">

        <div class="credit">

        

            <a href="https://www.instagram.com/alaaherzallah05"
               target="_blank">

             <h1>علاء حرز الله </h1>

            </a>

        </div>

    </div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

function resizeCanvas(){

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}

resizeCanvas();

window.addEventListener("resize",resizeCanvas);

const stars=[];
const sparkles=[];
const particles=[];

/* ===== BACKGROUND STARS ===== */

for(let i=0;i<240;i++){

    stars.push({

        x:Math.random()*window.innerWidth,
        y:Math.random()*window.innerHeight,

        r:Math.random()*2.2+0.4,

        alpha:Math.random()*0.7+0.25,

        speed:Math.random()*0.25+0.05,

        color:[
            "255,255,255",
            "255,234,170",
            "210,190,255",
            "255,210,235"
        ][Math.floor(Math.random()*4)]
    });
}

for(let i=0;i<55;i++){

    particles.push({

        x:Math.random()*window.innerWidth,
        y:Math.random()*window.innerHeight,

        r:Math.random()*3+1,

        dx:(Math.random()-.5)*0.35,
        dy:(Math.random()-.5)*0.35,

        color:[
            "rgba(255,216,107,.45)",
            "rgba(180,140,255,.35)",
            "rgba(255,170,220,.35)",
            "rgba(120,230,255,.3)"
        ][Math.floor(Math.random()*4)]
    });
}

function drawBackgroundGlow(){

    let glow1=ctx.createRadialGradient(
        canvas.width*0.2,
        canvas.height*0.2,
        0,
        canvas.width*0.2,
        canvas.height*0.2,
        canvas.width*0.5
    );

    glow1.addColorStop(0,"rgba(255,190,80,.16)");
    glow1.addColorStop(1,"rgba(255,190,80,0)");

    ctx.fillStyle=glow1;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    let glow2=ctx.createRadialGradient(
        canvas.width*0.85,
        canvas.height*0.25,
        0,
        canvas.width*0.85,
        canvas.height*0.25,
        canvas.width*0.45
    );

    glow2.addColorStop(0,"rgba(180,120,255,.14)");
    glow2.addColorStop(1,"rgba(180,120,255,0)");

    ctx.fillStyle=glow2;
    ctx.fillRect(0,0,canvas.width,canvas.height);
}

function drawStars(){

    stars.forEach(s=>{

        s.y+=s.speed;

        if(s.y>canvas.height){

            s.y=0;
            s.x=Math.random()*canvas.width;
        }

        ctx.beginPath();

        ctx.fillStyle=`rgba(${s.color},${s.alpha})`;

        ctx.arc(
            s.x,
            s.y,
            s.r,
            0,
            Math.PI*2
        );

        ctx.fill();
    });
}

function drawParticles(){

    particles.forEach(p=>{

        p.x+=p.dx;
        p.y+=p.dy;

        if(p.x<0 || p.x>canvas.width) p.dx*=-1;
        if(p.y<0 || p.y>canvas.height) p.dy*=-1;

        ctx.beginPath();

        ctx.fillStyle=p.color;

        ctx.shadowColor=p.color;
        ctx.shadowBlur=14;

        ctx.arc(
            p.x,
            p.y,
            p.r,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur=0;
    });
}

/* ===== DECORATIONS ===== */

function drawFlag(x,y,size,color1,color2){

    let grad=ctx.createLinearGradient(x,y,x,y+size);

    grad.addColorStop(0,color1);
    grad.addColorStop(1,color2);

    ctx.fillStyle=grad;

    ctx.shadowColor=color1;
    ctx.shadowBlur=12;

    ctx.beginPath();

    ctx.moveTo(x,y);
    ctx.lineTo(x+size*.7,y+size*.15);
    ctx.lineTo(x+size*.35,y+size);

    ctx.closePath();

    ctx.fill();

    ctx.shadowBlur=0;
}

function drawLantern(x,y,s){

    ctx.save();

    ctx.translate(x,y);

    ctx.strokeStyle="rgba(255,231,170,.9)";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.moveTo(0,-20*s);
    ctx.lineTo(0,-5*s);
    ctx.stroke();

    let grad=ctx.createRadialGradient(
        0,
        8*s,
        2*s,
        0,
        8*s,
        28*s
    );

    grad.addColorStop(0,"rgba(255,255,210,1)");
    grad.addColorStop(.45,"rgba(255,190,70,.85)");
    grad.addColorStop(1,"rgba(255,140,0,.15)");

    ctx.fillStyle=grad;

    ctx.shadowColor="rgba(255,190,70,.9)";
    ctx.shadowBlur=18;

    ctx.beginPath();

    ctx.roundRect(
        -12*s,
        -5*s,
        24*s,
        34*s,
        8*s
    );

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.strokeStyle="rgba(255,240,190,.9)";
    ctx.stroke();

    ctx.restore();
}

function drawDecorations(){

    const flagColors=[
        ["#fff3b0","#ffb703"],
        ["#ffd6f6","#ff4fa3"],
        ["#d6fff6","#00d9c0"],
        ["#e5d5ff","#9d4dff"],
        ["#ffffff","#ffc857"]
    ];

    ctx.lineWidth=3;

    ctx.strokeStyle="rgba(255,238,190,.9)";

    ctx.shadowColor="rgba(255,216,107,.7)";
    ctx.shadowBlur=12;

    ctx.beginPath();

    ctx.moveTo(0,55);

    ctx.quadraticCurveTo(
        canvas.width*.25,
        145,
        canvas.width*.5,
        95
    );

    ctx.quadraticCurveTo(
        canvas.width*.75,
        45,
        canvas.width,
        115
    );

    ctx.stroke();

    ctx.shadowBlur=0;

    for(let i=0;i<14;i++){

        let t=i/13;

        let x=t*canvas.width;

        let y;

        if(t<=.5){

            let tt=t/.5;

            y=
            (1-tt)*(1-tt)*55 +
            2*(1-tt)*tt*145 +
            tt*tt*95;

        }else{

            let tt=(t-.5)/.5;

            y=
            (1-tt)*(1-tt)*95 +
            2*(1-tt)*tt*45 +
            tt*tt*115;
        }

        if(i%4===0){

            drawLantern(x,y+24,0.8);

        }else{

            let c=flagColors[i%flagColors.length];

            drawFlag(
                x-16,
                y+10,
                42,
                c[0],
                c[1]
            );
        }
    }
}

/* ===== SPARKLES ===== */

function createSparkles(){

    if(sparkles.length<55){

        sparkles.push({

            x:Math.random()*canvas.width,
            y:Math.random()*canvas.height,

            size:Math.random()*9+4,

            color:[
                "#ffffff",
                "#ffd86b",
                "#9dfcff",
                "#ffb7df"
            ][Math.floor(Math.random()*4)],

            life:50,

            rotate:Math.random()*Math.PI
        });
    }
}

function drawSparkles(){

    sparkles.forEach((s,index)=>{

        ctx.save();

        ctx.translate(s.x,s.y);

        ctx.rotate(s.rotate);

        ctx.strokeStyle=s.color;

        ctx.lineWidth=2;

        ctx.shadowColor=s.color;
        ctx.shadowBlur=12;

        ctx.beginPath();
        ctx.moveTo(-s.size,0);
        ctx.lineTo(s.size,0);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0,-s.size);
        ctx.lineTo(0,s.size);
        ctx.stroke();

        ctx.restore();

        s.life--;

        if(s.life<=0){

            sparkles.splice(index,1);
        }
    });
}

/* ===== WORD ANIMATION ===== */

function showWords(
    element,
    text,
    startDelay=0,
    wordDelay=350
){

    const words=text.split(" ");

    words.forEach((word,index)=>{

        setTimeout(()=>{

            const span=document.createElement("span");

            span.className="word";

            span.textContent=word;

            element.appendChild(span);

        },startDelay + index * wordDelay);
    });

    return startDelay + words.length * wordDelay;
}

/* ===== TEXT ===== */

const title1=document.getElementById("title1");
const title2=document.getElementById("title2");
const arabicText=document.getElementById("arabicText");

let delay=300;

delay=
showWords(
    title1,
    "Eid-Adha",
    delay,
    350
)+300;

delay=
showWords(
    title2,
    "Mubarak",
    delay,
    350
)+400;

const lines=[
    "كل عام وانتم بالف خير",
    "عيدكم مبارك ينعاد علينا وعليكم",
    "بالصحه والسلامه يارب"
];

lines.forEach((line)=>{

    setTimeout(()=>{

        const div=document.createElement("div");

        arabicText.appendChild(div);

        showWords(
            div,
            line,
            0,
            280
        );

    },delay);

    delay +=
    line.split(" ").length * 280 + 500;
});

/* ===== AUTO MUSIC ===== */

const music=document.getElementById("bgMusic");

function enableSound(){

    music.muted=false;

    music.play();

    document.removeEventListener(
        "click",
        enableSound
    );
}

document.addEventListener(
    "click",
    enableSound
);

/* ===== ANIMATION ===== */

function animate(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBackgroundGlow();

    drawStars();

    drawParticles();

    drawDecorations();

    createSparkles();

    drawSparkles();

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
